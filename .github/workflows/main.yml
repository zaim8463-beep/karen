
name: Build Karen APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate Android Project
        shell: bash
        run: |
          PROJECT_FILE=$(find . -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -not -path "*/.git/*" \
            -not -path "*/.gradle/*" \
            -print -quit)

          if [ -n "$PROJECT_FILE" ]; then
            PROJECT_DIR=$(dirname "$PROJECT_FILE")
          else
            APP_FILE=$(find . -type f \
              \( -path "*/app/build.gradle.kts" -o -path "*/app/build.gradle" \) \
              -not -path "*/.git/*" \
              -not -path "*/.gradle/*" \
              -print -quit)

            if [ -z "$APP_FILE" ]; then
              echo "Android project not found!"
              echo "Repository contents:"
              find . -maxdepth 5 -type f | head -n 150
              exit 1
            fi

            PROJECT_DIR=$(dirname "$(dirname "$APP_FILE")")
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Karen-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
